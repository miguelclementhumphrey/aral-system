kind = "web"
previewPath = "/"
title = "ARAL System"
version = "1.0.0"
id = "artifacts/aral-system"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25610

[services.development]
run = "pnpm --filter @workspace/aral-system run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aral-system", "run", "build" ]
publicDir = "artifacts/aral-system/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25610"
BASE_PATH = "/"
